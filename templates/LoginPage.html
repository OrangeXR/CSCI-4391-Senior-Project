{% extends 'HomePageSetup.html' %}

{% block head %}
<title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/homestyle.css') }}">
{% endblock %}

{% block body %}
<div class="welcome1">
    <h1>Login</h1>
</div>

<form method="POST" class="body">
    <label>Username</label>
    <input name="username" required>

    <label>Password</label>
    <input name="password" type="password" required>

    <button type="submit" class="text">Login</button>
</form>

<a href="/register" class="text">Create an account</a>
{% endblock %}
